name: Performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: '0.17.0-dev.956+2dca73595'
  # Performance budgets
  MAX_STARTUP_MS: 10
  MAX_COMMAND_EXEC_MS: 15

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MAX_IDLE_MEMORY_KB: ${{ matrix.max_idle_memory_kb }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux RSS includes more dynamic-loader overhead on hosted runners.
          - os: ubuntu-latest
            max_idle_memory_kb: 6656
          - os: macos-latest
            max_idle_memory_kb: 5120

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-cache
          key: ${{ runner.os }}-zig-perf-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-perf-${{ env.ZIG_VERSION }}-

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSmall

      - name: Measure startup time
        id: startup
        run: |
          python3 - <<'PY'
          import math
          import os
          import subprocess
          import time

          command = ["./zig-out/bin/den", "-c", "exit"]
          for _ in range(3):
              subprocess.run(
                  command,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )

          samples = []
          for _ in range(10):
              started = time.perf_counter_ns()
              subprocess.run(
                  command,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )
              samples.append(time.perf_counter_ns() - started)

          average_ms = math.ceil(sum(samples) / len(samples) / 1_000_000)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"startup_ms={average_ms}\n")
          print(f"Average startup time: {average_ms}ms")
          PY

      - name: Check startup time budget
        run: |
          if [ ${{ steps.startup.outputs.startup_ms }} -gt ${{ env.MAX_STARTUP_MS }} ]; then
            echo "::error::Startup time ${{ steps.startup.outputs.startup_ms }}ms exceeds budget of ${{ env.MAX_STARTUP_MS }}ms"
            exit 1
          fi
          echo "✓ Startup time ${{ steps.startup.outputs.startup_ms }}ms is within budget"

      - name: Measure idle memory
        id: memory
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import time

          process = subprocess.Popen(
              ["./zig-out/bin/den", "--norc"],
              stdin=subprocess.PIPE,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          def read_rss_kb(pid):
              status = pathlib.Path(f"/proc/{pid}/status")
              if status.exists():
                  rss_line = next(
                      line for line in status.read_text().splitlines()
                      if line.startswith("VmRSS:")
                  )
                  return int(rss_line.split()[1])
              return int(subprocess.check_output(
                  ["ps", "-o", "rss=", "-p", str(pid)],
                  text=True,
              ).strip())

          try:
              samples = []
              for _ in range(5):
                  time.sleep(0.05)
                  if process.poll() is not None:
                      raise RuntimeError("Den exited before idle memory could be measured")
                  samples.append(read_rss_kb(process.pid))
              rss_kb = max(samples)
          finally:
              process.communicate(b"exit\n", timeout=5)
          if process.returncode != 0:
              raise subprocess.CalledProcessError(process.returncode, process.args)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"memory_kb={rss_kb}\n")
          print(f"Idle memory: {rss_kb / 1024:.2f}MiB ({rss_kb}KiB)")
          PY

      - name: Check memory budget
        run: |
          if [ ${{ steps.memory.outputs.memory_kb }} -gt ${{ env.MAX_IDLE_MEMORY_KB }} ]; then
            echo "::error::Idle memory ${{ steps.memory.outputs.memory_kb }}KiB exceeds budget of ${{ env.MAX_IDLE_MEMORY_KB }}KiB"
            exit 1
          fi
          echo "✓ Idle memory ${{ steps.memory.outputs.memory_kb }}KiB is within budget"

      - name: Measure command execution time
        id: exec
        run: |
          python3 - <<'PY'
          import math
          import os
          import subprocess
          import time

          samples = []
          for _ in range(100):
              started = time.perf_counter_ns()
              subprocess.run(
                  ["./zig-out/bin/den", "-c", "true"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=True,
              )
              samples.append(time.perf_counter_ns() - started)

          average_ms = math.ceil(sum(samples) / len(samples) / 1_000_000)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exec_ms={average_ms}\n")
          print(f"Average command execution: {average_ms}ms")
          PY

      - name: Check execution time budget
        run: |
          if [ ${{ steps.exec.outputs.exec_ms }} -gt ${{ env.MAX_COMMAND_EXEC_MS }} ]; then
            echo "::error::Command execution ${{ steps.exec.outputs.exec_ms }}ms exceeds budget of ${{ env.MAX_COMMAND_EXEC_MS }}ms"
            exit 1
          fi
          echo "✓ Command execution ${{ steps.exec.outputs.exec_ms }}ms is within budget"

      - name: Measure binary size
        id: size
        run: |
          size=$(stat -f%z ./zig-out/bin/den 2>/dev/null || stat --printf="%s" ./zig-out/bin/den)
          size_mb=$((size / 1024 / 1024))
          echo "size_mb=$size_mb" >> $GITHUB_OUTPUT
          echo "Binary size: ${size_mb}MB"

      - name: Run benchmarks
        run: |
          echo "=== Performance Summary ==="
          echo "Startup time: ${{ steps.startup.outputs.startup_ms }}ms (budget: ${{ env.MAX_STARTUP_MS }}ms)"
          echo "Idle memory: ${{ steps.memory.outputs.memory_kb }}KiB (budget: ${{ env.MAX_IDLE_MEMORY_KB }}KiB)"
          echo "Command exec: ${{ steps.exec.outputs.exec_ms }}ms (budget: ${{ env.MAX_COMMAND_EXEC_MS }}ms)"
          echo "Binary size: ${{ steps.size.outputs.size_mb }}MB"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            zig-out/bin/den
          retention-days: 7

  compare:
    name: Compare with baseline
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - name: Download PR artifacts
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-ubuntu-latest
          path: pr-binary/

      - name: Compare performance
        run: |
          echo "Performance comparison would go here"
          echo "In a full implementation, this would:"
          echo "1. Download baseline metrics from main branch"
          echo "2. Compare against PR metrics"
          echo "3. Report regressions > 10%"
