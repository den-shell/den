name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run integration tests daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: '0.17.0-dev.2313+5b9147ed5'

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-cache
          key: ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe

      - name: Test basic shell startup
        run: |
          echo "Testing shell startup..."
          ./zig-out/bin/den -c "echo 'Hello from Den'"
          test "$(./zig-out/bin/den --norc -ilc 'printf den-grouped-flags')" = den-grouped-flags

      - name: Test arguments to shell commands
        run: |
          expected="$(printf '<%s>\n' harness-probe 6 -l --json -i 'two words' '' -c)"
          for option in -c -ilc; do
            actual="$(./zig-out/bin/den --norc "$option" 'printf "<%s>\n" "$0" "$#" "$@"' harness-probe -l --json -i 'two words' '' -c)"
            test "$actual" = "$expected"
          done
          test "$(./zig-out/bin/den --norc -c 'printf "%s" "$0"')" = den

      - name: Test builtin commands
        run: |
          echo "Testing builtin commands..."
          ./zig-out/bin/den -c "pwd"
          ./zig-out/bin/den -c "echo test"
          ./zig-out/bin/den -c "true"
          ./zig-out/bin/den -c "false" || true

      - name: Test environment variables
        run: |
          echo "Testing environment variables..."
          ./zig-out/bin/den -c "export TEST_VAR=hello && echo \$TEST_VAR"

      - name: Test command chaining
        run: |
          echo "Testing command chaining..."
          ./zig-out/bin/den -c "echo 'first' && echo 'second'"
          ./zig-out/bin/den -c "false || echo 'fallback'"

      - name: Test pipes (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "Testing pipes..."
          ./zig-out/bin/den -c "echo 'hello world' | cat"

      - name: Test redirections
        run: |
          echo "Testing redirections..."
          ./zig-out/bin/den -c "echo 'test content' > /tmp/den_test.txt"
          ./zig-out/bin/den -c "cat /tmp/den_test.txt"
          rm -f /tmp/den_test.txt

      - name: Test arithmetic
        run: |
          echo "Testing arithmetic..."
          ./zig-out/bin/den -c "calc 2 + 2"
          ./zig-out/bin/den -c "calc 10 '*' 5"

      - name: Test productivity builtins
        run: |
          echo "Testing productivity builtins..."
          ./zig-out/bin/den -c "date"
          ./zig-out/bin/den -c "seq 1 5"
          ./zig-out/bin/den -c "uuid" || true

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs-${{ matrix.os }}
          path: |
            zig-out/
            .zig-cache/

  e2e-shell-session:
    name: End-to-End Shell Session
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Run E2E tests
        run: |
          set -e
          echo "=== E2E Shell Session Test ==="

          # Test 1: Basic commands
          echo "Test 1: Basic commands"
          ./zig-out/bin/den -c "pwd"
          ./zig-out/bin/den -c "echo 'Hello World'"

          # Test 2: Directory navigation
          echo "Test 2: Directory navigation"
          mkdir test_dir
          ./zig-out/bin/den -c "cd test_dir && pwd"
          rmdir test_dir

          # Test 3: File manipulation
          echo "Test 3: File manipulation"
          ./zig-out/bin/den -c "echo 'test' > temp.txt"
          ./zig-out/bin/den -c "cat temp.txt"
          rm -f temp.txt

          # Test 4: Builtins
          echo "Test 4: Builtins"
          ./zig-out/bin/den -c "calc 10 + 20"
          ./zig-out/bin/den -c "seq 1 3"

          # Test 5: Complex commands
          echo "Test 5: Complex commands"
          ./zig-out/bin/den -c "echo 'test' && echo 'success'"

          echo "=== All E2E tests passed! ==="

      - name: Verify directory markers with a real terminal
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import pty
          import select
          import signal
          import tempfile
          import time
          import urllib.parse

          den = pathlib.Path('zig-out/bin/den').resolve()
          with tempfile.TemporaryDirectory() as name:
              root = pathlib.Path(name).resolve()
              folders = (root / 'source A', root / 'source B')
              for folder in folders:
                  folder.mkdir()
              env = dict(os.environ, HOME=str(root), TERM='xterm-256color', DEN_SHELL_INTEGRATION='1')
              pid, terminal = pty.fork()
              if pid == 0:
                  os.chdir(root)
                  os.execve(den, [den, '--norc', '-i'], env)

              def read_until(marker):
                  data = bytearray()
                  deadline = time.monotonic() + 8
                  while marker not in data and time.monotonic() < deadline:
                      if select.select([terminal], [], [], 0.1)[0]:
                          data.extend(os.read(terminal, 4096))
                  if marker not in data:
                      raise AssertionError(repr(data))
                  return data

              try:
                  read_until(b'\x1b]133;B\x1b\\')
                  os.write(terminal, b"cd 'source A' && printf '%s\\n' FIRST && cd '../source B' && printf '%s\\n' SECOND | cat\r")
                  data = read_until(b'\x1b]133;D')
                  start = data.index(b'\x1b]133;C\x1b\\')
                  output = data[start:data.index(b'\x1b]133;D', start)]
                  offset = 0
                  for folder, line in zip(folders, (b'FIRST\r\n', b'SECOND\r\n')):
                      uri = b'\x1b]7;file://' + urllib.parse.quote(str(folder)).encode() + b'\x1b\\'
                      offset = output.index(uri, offset) + len(uri)
                      offset = output.index(line, offset) + len(line)
              finally:
                  os.close(terminal)
                  if os.waitpid(pid, os.WNOHANG)[0] == 0:
                      try:
                          os.kill(pid, signal.SIGTERM)
                      except ProcessLookupError:
                          pass
                      os.waitpid(pid, 0)
          PY

  performance-benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Build release
        run: zig build -Doptimize=ReleaseFast

      - name: Install hyperfine
        run: |
          wget https://github.com/sharkdp/hyperfine/releases/download/v1.18.0/hyperfine_1.18.0_amd64.deb
          sudo dpkg -i hyperfine_1.18.0_amd64.deb

      - name: Benchmark startup time
        run: |
          echo "=== Startup Time Benchmark ==="
          hyperfine --warmup 3 --min-runs 10 \
            './zig-out/bin/den -c "true"' \
            --export-json startup-benchmark.json

      - name: Benchmark echo command
        run: |
          echo "=== Echo Command Benchmark ==="
          hyperfine --warmup 3 --min-runs 10 \
            './zig-out/bin/den -c "echo hello"' \
            --export-json echo-benchmark.json

      - name: Benchmark command chaining
        run: |
          echo "=== Command Chaining Benchmark ==="
          hyperfine --warmup 3 --min-runs 10 \
            './zig-out/bin/den -c "true && true && true"' \
            --export-json chain-benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            *-benchmark.json

      - name: Show benchmark summary
        run: |
          echo "=== Benchmark Summary ==="
          cat startup-benchmark.json | jq '.results[0] | {command, mean, stddev, min, max}'
          cat echo-benchmark.json | jq '.results[0] | {command, mean, stddev, min, max}'
          cat chain-benchmark.json | jq '.results[0] | {command, mean, stddev, min, max}'
