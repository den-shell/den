name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: '0.17.0-dev.956+2dca73595'

jobs:
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Windows temporarily disabled due to POSIX-specific code

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Cache Zig artifacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
            zig-cache
          key: ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-

      - name: Build
        run: zig build

      - name: Run all tests
        run: zig build test

      - name: Run tokenizer tests
        run: zig build test-tokenizer

      - name: Run parser tests
        run: zig build test-parser

      - name: Run expander tests
        run: zig build test-expansion

      - name: Run new-feature subsystem tests (zsh/AI/sessions/wasm)
        run: zig build test-features

      - name: Test shell startup
        run: |
          python3 - <<'PY'
          import subprocess

          subprocess.run(
              ["./zig-out/bin/den", "--norc"],
              input=b"exit\n",
              timeout=5,
              check=True,
          )
          PY

      - name: Test basic commands
        run: |
          ./zig-out/bin/den -c "echo hello"
          ./zig-out/bin/den -c "pwd"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            zig-out/
            .zig-cache/

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check src/

  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [test, lint]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Zig
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          packages: ziglang.org@${{ env.ZIG_VERSION }}

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: den-${{ matrix.os }}
          path: zig-out/bin/den
