name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ZIG_VERSION: '0.17.0-dev.956+2dca73595'

jobs:
  build:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
            artifact: den-linux-x64
            binary: den
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-linux-musl
            artifact: den-linux-arm64
            binary: den
            archive: tar.gz
          - os: macos-latest
            target: x86_64-macos
            artifact: den-darwin-x64
            binary: den
            archive: tar.gz
          - os: macos-latest
            target: aarch64-macos
            artifact: den-darwin-arm64
            binary: den
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-windows
            artifact: den-windows-x64
            binary: den.exe
            archive: zip
          - os: ubuntu-latest
            target: aarch64-windows
            artifact: den-windows-arm64
            binary: den.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-freebsd
            artifact: den-freebsd-x64
            binary: den
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-freebsd
            artifact: den-freebsd-arm64
            binary: den
            archive: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: |
          echo "Building Den Shell v${{ steps.version.outputs.VERSION }} for ${{ matrix.target }}"
          zig build release-target -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }}

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          cp "zig-out/bin/${{ matrix.binary }}" dist/
          cd dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip "${{ matrix.artifact }}-${{ steps.version.outputs.VERSION }}.zip" "${{ matrix.binary }}"
          else
            tar -czf "${{ matrix.artifact }}-${{ steps.version.outputs.VERSION }}.tar.gz" "${{ matrix.binary }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release with Pantry
        uses: pantry-pm/pantry/packages/action@e2bc11fa83e4baff009dea2a12ef04ae6826976c # main
        with:
          install: 'false'
          release: 'true'
          release-files: |
            dist/*.tar.gz
            dist/*.zip
          release-changelog: CHANGELOG.md
          release-checksums: sha256
          release-prerelease: ${{ contains(github.ref_name, '-') }}
          release-token: ${{ secrets.GITHUB_TOKEN }}
